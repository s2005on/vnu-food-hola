name: Backend checks
on:
  push:
    paths: ['server/**', 'tests/test_server.py', '.github/workflows/backend-ci.yml']
  pull_request:
    paths: ['server/**', 'tests/test_server.py', '.github/workflows/backend-ci.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m pip install -r server/requirements-test.txt
      - run: python -m unittest discover -s tests -p test_server.py -v
      - run: node --check server/web/app.js
      - run: node --check server/web/admin.js
