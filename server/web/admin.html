<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Quản trị — VJU Food Hola</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="admin.css"><script src="admin.js" defer></script></head><body>
<header class="top"><a class="brand" href="./">VJU <b>food hola</b></a><nav><a href="./">Trang khách</a><button id="logout" class="secondary" hidden>Đăng xuất</button></nav></header>
<main class="admin-wrap"><h1>Quản trị quán</h1><p>Bản chạy thử · Dữ liệu được lưu trên máy chủ</p><p id="message" role="status"></p>
<form id="login" class="panel"><h2>Đăng nhập</h2><label>Tên đăng nhập<input name="username" autocomplete="username" required></label><label>Mật khẩu<input name="password" type="password" autocomplete="current-password" required></label><button class="primary">Đăng nhập</button></form>
<div id="dashboard" hidden><div id="stats" class="stats"></div><nav class="tabs"><button data-tab="orders-panel" class="secondary">Đơn hàng</button><button data-tab="dishes-panel" class="secondary">Thực đơn</button><button data-tab="shop-panel" class="secondary">Cài đặt quán</button></nav>
<section id="orders-panel" class="panel"><h2>Đơn hàng</h2><p>Danh sách tự cập nhật mỗi 15 giây. Mỗi trang tối đa 50 đơn.</p><select id="filter"><option value="">Tất cả trạng thái</option value="pending">Chờ xác nhận</option><option value="confirmed">Đã xác nhận</option><option value="preparing">Đang chuẩn bị</option><option value="ready">Sẵn sàng nhận</option><option value="completed">Hoàn thành</option><option value="cancelled">Đã hủy</option></select><button id="refresh" class="secondary">Cập nhật</button><div id="order-list"></div><button id="prev" class="secondary">Trang trước</button><span id="page"></span><button id="next" class="secondary">Trang sau</button></section>
<section id="dishes-panel" class="panel" hidden><h2>Thực đơn</h2><button id="new-dish" class="primary">Thêm món</button><div id="dish-list"></div></section>
<section id="shop-panel" class="panel" hidden><h2>Giờ nhận đơn</h2><form id="shop-form"><label>Tên quán / điểm nhận<input name="name" required maxlength="100"></label><label>Giờ mở<input name="opens" type="time" required></label><label>Giờ đóng<input name="closes" type="time" required></label><label><input name="accepting" type="checkbox"> Bật nhận đơn</label><p>Khung nhận 30 phút trong hôm nay, đặt trước ít nhất 15 phút. Chưa hỗ trợ giờ qua đêm.</p><button class="primary">Lưu cài đặt</button></form></section>
</div></main>
<dialog id="dish-dialog"><h2 id="dish-title">Món ăn</h2><form id="dish-form"><input name="id" type="hidden"><label>Tên món<input name="name" required maxlength="100"></label><label>Mô tả<textarea name="desc" maxlength="300"></textarea></label><label>Giá (VND)<input name="price" type="number" min="0" max="10000000" step="1" required></label><label>Loại món<select name="category"><option>Cơm</option><option>Bún &amp; mì</option><option>Ăn nhẹ</option><option>Đồ uống</option></select></label><label>Biểu tượng<input name="emoji" maxlength="12" value="🍽️"></label><label>Nhãn ngắn<input name="tag" maxlength="40"></label><label>Màu nền<input name="bg" type="color" value="#f6e8d5"></label><label><input name="available" type="checkbox" checked> Còn món</label><label><input name="active" type="checkbox" checked> Hiện trên thực đơn</label><p id="dish-error" role="alert"></p><button class="primary">Lưu món</button><button id="close-dish" type="button" class="secondary">Đóng</button></form></dialog>
</body></html>
